# SmartRoofing AI signing stack for sign.smartroofing.ai.
#
#   cd docker/smartroofing
#   cp .env.example .env          # fill in the secrets
#   docker compose up -d --build
#
# Caddy is the only published service. It terminates TLS for the hostname in
# SIGN_HOST with an automatic Let's Encrypt certificate and proxies to the
# SR Sign container, which is never exposed directly. Postgres is reachable
# only from SR Sign on the private network.
#
# The SR Sign image is built from this fork so the native Signing API,
# consent gate and digest logging ship with it. Rebuild after pulling:
#   docker compose up -d --build sr-sign

name: smartroofing-sign

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

services:
  caddy:
    <<: *restart
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      SIGN_HOST: ${SIGN_HOST:?set SIGN_HOST in .env, e.g. sign.smartroofing.ai}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      - sr-sign

  database:
    <<: *restart
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sr_sign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sr_sign}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sr_sign} -d ${POSTGRES_DB:-sr_sign}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - database:/var/lib/postgresql/data
    networks: [core]

  sr-sign:
    <<: *restart
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    # Everything SR Sign reads comes from .env in this directory. Keep
    # secrets there (or render it from your secret store); never bake them
    # into the image.
    env_file:
      - .env
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://sr-sign:3000
      NEXT_PRIVATE_DATABASE_URL: postgresql://${POSTGRES_USER:-sr_sign}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-sr_sign}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-sr_sign}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-sr_sign}
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/sr-sign/cert.p12
    volumes:
      # The PKCS#12 bundle produced by scripts/generate-signing-certificate.sh
      # (or your CA-issued certificate). Read-only inside the container.
      - ${SIGNING_CERT_PATH:?set SIGNING_CERT_PATH in .env}:/opt/sr-sign/cert.p12:ro
    networks: [edge, core]

networks:
  edge:
  core:

volumes:
  database:
  caddy_data:
  caddy_config:
